<section class="testnet-stats-section">
  <h2 class="testnet-stats-title"><span class="live-dot"></span>{{ T "testnet_live_title" }}</h2>
  <p class="testnet-stats-sub">{{ T "testnet_live_sub" }}</p>

  <div class="ethwei-stats" id="ethwei-stats-home">
    <div class="ethwei-stat">
      <span class="ethwei-stat-value" data-stat="height">–</span>
      <span class="ethwei-stat-label">{{ T "stat_block_height" }}</span>
    </div>
    <div class="ethwei-stat">
      <span class="ethwei-stat-value" data-stat="supply">–</span>
      <span class="ethwei-stat-label">{{ T "stat_total_supply" }}</span>
    </div>
    <div class="ethwei-stat">
      <span class="ethwei-stat-value" data-stat="remaining-supply">–</span>
      <span class="ethwei-stat-label">{{ T "stat_remaining_supply" }}</span>
    </div>
    <div class="ethwei-stat">
      <span class="ethwei-stat-value" data-stat="max-supply">–</span>
      <span class="ethwei-stat-label">{{ T "stat_max_supply" }}</span>
    </div>
    <div class="ethwei-stat">
      <span class="ethwei-stat-value" data-stat="bonded">–</span>
      <span class="ethwei-stat-label">{{ T "stat_bonded" }}</span>
    </div>
    <div class="ethwei-stat">
      <span class="ethwei-stat-value" data-stat="burned">–</span>
      <span class="ethwei-stat-label">{{ T "stat_burned" }}</span>
    </div>
  </div>
</section>

<script>
(function () {
  var root = document.getElementById('ethwei-stats-home');
  if (!root) return;

  var heightEl = root.querySelector('[data-stat="height"]');
  var supplyEl = root.querySelector('[data-stat="supply"]');
  var bondedEl = root.querySelector('[data-stat="bonded"]');
  var maxSupplyEl = root.querySelector('[data-stat="max-supply"]');
  var remainingSupplyEl = root.querySelector('[data-stat="remaining-supply"]');
  var burnedEl = root.querySelector('[data-stat="burned"]');

  var DECIMALS = 6; // ETE/WEI exponent
  var MAX_SUPPLY_ETE = 10000000000; // fixed cap, 10B ETE
  function toEte(amount) {
    return (Number(amount) / Math.pow(10, DECIMALS)).toLocaleString(undefined, { maximumFractionDigits: 0 });
  }
  function fmt(n) {
    return n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  }

  maxSupplyEl.textContent = fmt(MAX_SUPPLY_ETE);

  function fetchWithTimeout(url, ms) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, ms);
    return fetch(url, { signal: controller.signal }).finally(function () { clearTimeout(timer); });
  }

  // Remaining Supply = Max Supply - Total Supply - Burned. Burns already
  // reduce Total Supply directly (no burn address), so the cap on lifetime
  // mintable supply requires adding burns back before subtracting from Max.
  var lastTotalEte = null;
  var lastBurnedEte = null;
  function updateRemaining() {
    if (lastTotalEte === null || lastBurnedEte === null) return;
    remainingSupplyEl.textContent = fmt(Math.max(MAX_SUPPLY_ETE - lastTotalEte - lastBurnedEte, 0));
  }

  var inFlight = false;
  async function refresh() {
    if (inFlight) return;
    inFlight = true;
    try {
      var [statusRes, supplyRes, poolRes] = await Promise.all([
        fetchWithTimeout('https://rpc-testnet.ethwei.com/status', 5000).then(function (r) { return r.json(); }),
        fetchWithTimeout('https://api-testnet.ethwei.com/cosmos/bank/v1beta1/supply/by_denom?denom=WEI', 5000).then(function (r) { return r.json(); }),
        fetchWithTimeout('https://api-testnet.ethwei.com/cosmos/staking/v1beta1/pool', 5000).then(function (r) { return r.json(); }),
      ]);

      var height = Number(statusRes.result.sync_info.latest_block_height);
      heightEl.textContent = height.toLocaleString();

      if (supplyRes.amount) {
        lastTotalEte = Number(supplyRes.amount.amount) / Math.pow(10, DECIMALS);
        supplyEl.textContent = fmt(lastTotalEte);
        updateRemaining();
      }
      if (poolRes.pool) bondedEl.textContent = toEte(poolRes.pool.bonded_tokens);
    } catch (e) {
      // Leave last-known values on screen; testnet RPC/API can be momentarily unavailable.
    } finally {
      inFlight = false;
    }
  }

  // Burned total: summed from on-chain "slash" events (finalize_block_events),
  // via CometBFT's block_search + block_results RPCs. There is no burn address
  // and no aggregate "total burned" endpoint, so this is computed by finding
  // every block with a slash event and summing each event's burned_coins.
  // Refreshed on its own slower interval since it costs one request per event.
  var burnedInFlight = false;
  async function refreshBurned() {
    if (burnedInFlight) return;
    burnedInFlight = true;
    try {
      var query = encodeURIComponent('"slash.reason EXISTS"');
      var searchRes = await fetchWithTimeout(
        'https://rpc-testnet.ethwei.com/block_search?query=' + query + '&per_page=100',
        8000
      ).then(function (r) { return r.json(); });

      var blocks = (searchRes.result && searchRes.result.blocks) || [];
      var heights = blocks.map(function (b) { return b.block.header.height; });

      var results = await Promise.all(heights.map(function (h) {
        return fetchWithTimeout('https://rpc-testnet.ethwei.com/block_results?height=' + h, 8000)
          .then(function (r) { return r.json(); })
          .catch(function () { return null; });
      }));

      var totalBurnedUwei = 0;
      results.forEach(function (res) {
        if (!res || !res.result || !res.result.finalize_block_events) return;
        res.result.finalize_block_events.forEach(function (ev) {
          if (ev.type !== 'slash') return;
          var attr = ev.attributes.find(function (a) { return a.key === 'burned_coins'; });
          if (attr) totalBurnedUwei += Number(attr.value);
        });
      });

      lastBurnedEte = totalBurnedUwei / Math.pow(10, DECIMALS);
      burnedEl.textContent = fmt(lastBurnedEte);
      updateRemaining();
    } catch (e) {
      // Leave last-known value on screen.
    } finally {
      burnedInFlight = false;
    }
  }

  refresh();
  refreshBurned();
  var pollId = setInterval(function () {
    if (!document.hidden) refresh();
  }, 10000);
  var burnedPollId = setInterval(function () {
    if (!document.hidden) refreshBurned();
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { refresh(); refreshBurned(); }
  });
})();
</script>
