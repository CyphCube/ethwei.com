baseURL = "https://ethwei.com/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = false

[params]
  description = "Ethwei is a beginner-friendly DeFi portal. Set up a wallet safely, check gas fees, understand DeFi risks, and practice on testnets before you use real money."

  [params.apps]
    wallet = "https://sacklink.com/"
    gas = "https://gas.ethwei.com/"
    defi = "https://defi.ethwei.com/"
    playground = "https://play.ethwei.com/"
    faucet = "https://faucet.circle.com/"

[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
    title = "Ethwei - Start DeFi simply. Stay safe."
