entries:
  - name: "Lending markets"
    type: "Lend and borrow"
    risk: "medium"
    what: "Deposit tokens to earn interest, or borrow against your deposit as collateral."
    reason: "Smart contract bugs, and forced liquidation if your collateral drops in value."
  - name: "Decentralized exchanges"
    type: "Swap tokens"
    risk: "medium"
    what: "Swap one token for another directly from your wallet, with no account needed."
    reason: "Slippage on large trades, fake tokens with the same name, and impermanent loss if you provide liquidity."
  - name: "Liquid staking"
    type: "Stake and earn"
    risk: "medium"
    what: "Stake a token and receive a receipt token that you can still use elsewhere."
    reason: "Smart contract bugs, and the receipt token can trade below the value of the staked token."
  - name: "Stablecoin yield farms"
    type: "Earn yield"
    risk: "high"
    what: "Put stablecoins into pools that pay rewards, often in a separate reward token."
    reason: "Very high advertised rates are often temporary, and reward tokens can lose value quickly. Stablecoins can also lose their peg."
